name: Feature Request
description: Suggest an idea, improvement, or new feature for ByeBlocked
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Got an idea, a "what if", or something you'd like to see supported? Feel free to share it here.

  - type: textarea
    id: feature-description
    attributes:
      label: What would you like to see?
      description: Describe the feature, idea, or improvement you're suggesting
      placeholder: e.g. "It would be cool if ByeBlocked also hid blocked users in..."
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Why is this useful?
      description: What problem does this solve, or what would it improve?
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Screenshots, examples, links, or anything else that helps explain the idea
    validations:
      required: false
